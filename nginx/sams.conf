# ============================================================
# SAMS internal proxy — one shared domain routed by path.
# Termination/HTTPS done by Coolify's Traefik in front of this
# container; this layer sees plain HTTP (X-Forwarded-Proto https
# is forwarded through so Django can trust the original scheme).
# ============================================================

upstream sams_backend {
    server backend:8000;
}

upstream sams_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Django: API + admin + its collected static
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://sams_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js: everything else (login, dashboards, QR scan, ...)
    location / {
        proxy_pass http://sams_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
