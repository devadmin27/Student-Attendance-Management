          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          title: วันเริ่มต้น
        end_date:
          type: string
          format: date
          title: วันสิ้นสุด
        is_active:
          type: boolean
          title: เปิดใช้งาน
        is_current:
          type: boolean
          title: ภาคปัจจุบัน
          description: อนุญาตให้มีได้เพียงภาคเดียวต่อการใช้งาน (ผ่าน application-level
