openapi: 3.0.3
info:
  title: SAMS API — Student Attendance Management System
  version: 1.0.0
  description: REST API ของระบบบริหารจัดการการเข้าเรียนผ่าน QR Code (SAMS)
paths:
  /api/v1/academic-terms/:
    get:
      operationId: academic_terms_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_current
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - academic-terms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicTermList'
          description: ''
    post:
      operationId: academic_terms_create
      tags:
      - academic-terms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTerm'
          description: ''
  /api/v1/academic-terms/{id}/:
    get:
      operationId: academic_terms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic term.
        required: true
      tags:
      - academic-terms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTerm'
          description: ''
    put:
      operationId: academic_terms_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic term.
        required: true
      tags:
      - academic-terms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicTermRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTerm'
          description: ''
    patch:
      operationId: academic_terms_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic term.
        required: true
      tags:
      - academic-terms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTermRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTermRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTermRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTerm'
          description: ''
    delete:
      operationId: academic_terms_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic term.
        required: true
      tags:
      - academic-terms
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attendance/check-in/:
    post:
      operationId: attendance_check_in_create
      description: Student QR check-in. Only the scanned token is accepted from the
        body.
      summary: เช็คชื่อผ่าน QR Token
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
          description: ''
  /api/v1/attendance/my-history/:
    get:
      operationId: attendance_my_history_list
      description: |-
        My attendance history — ownership enforced: always scoped to
        request.user's own student profile.
      summary: ประวัติการเช็คชื่อของตนเอง
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
          description: ''
  /api/v1/attendance/records/:
    get:
      operationId: attendance_records_list
      description: Attendance records list (admin/instructor full scope; students
        own only).
      parameters:
      - in: query
        name: attendance_session
        schema:
          type: string
          format: uuid
      - in: query
        name: attendance_session__course_offering
        schema:
          type: string
          format: uuid
      - in: query
        name: checked_in_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: checked_in_at__lte
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: สถานะ
          enum:
          - absent
          - excused
          - late
          - present
        description: |-
          * `present` - เข้าเรียน
          * `late` - มาสาย
          * `absent` - ขาดเรียน
          * `excused` - ลา/ได้รับอนุญาต
      - in: query
        name: student
        schema:
          type: string
          format: uuid
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceRecordList'
          description: ''
  /api/v1/attendance/records/{id}/:
    get:
      operationId: attendance_records_retrieve
      description: Attendance records list (admin/instructor full scope; students
        own only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attendance record.
        required: true
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
          description: ''
    patch:
      operationId: attendance_records_partial_update
      description: Attendance records list (admin/instructor full scope; students
        own only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attendance record.
        required: true
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRecordUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRecordUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRecordUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordUpdate'
          description: ''
  /api/v1/attendance/sessions/:
    get:
      operationId: attendance_sessions_list
      description: Create/read sessions; lifecycle managed via /open /pause /close
        /cancel.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceSessionList'
          description: ''
    post:
      operationId: attendance_sessions_create
      description: Only the offering's instructor (or admin) may create a session.
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceSessionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceSessionCreateRequest'
          multipart/form-data:
            schema:
