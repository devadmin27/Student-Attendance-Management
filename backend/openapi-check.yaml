components:
  schemas:
    AcademicTerm:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: ปีการศึกษา (พ.ศ.)
          description: ปีการศึกษาไทย พ.ศ. เช่น 2569 — เก็บตามที่ป้อน ไม่แปลงอัตโนมัติ
        semester:
          allOf:
          - $ref: '#/components/schemas/SemesterEnum'
          title: ภาคการศึกษา
        semester_display:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          title: วันเริ่มต้น
        end_date:
          type: string
          format: date
          title: วันสิ้นสุด
        is_active:
          type: boolean
          title: เปิดใช้งาน
        is_current:
          type: boolean
          title: ภาคปัจจุบัน
          description: อนุญาตให้มีได้เพียงภาคเดียวต่อการใช้งาน (ผ่าน application-level
            ตรวจสอบ)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - created_at
      - end_date
      - id
      - semester
      - semester_display
      - start_date
      - updated_at
    AcademicTermRequest:
      type: object
      properties:
        academic_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: ปีการศึกษา (พ.ศ.)
          description: ปีการศึกษาไทย พ.ศ. เช่น 2569 — เก็บตามที่ป้อน ไม่แปลงอัตโนมัติ
        semester:
          allOf:
          - $ref: '#/components/schemas/SemesterEnum'
          title: ภาคการศึกษา
        start_date:
          type: string
          format: date
          title: วันเริ่มต้น
        end_date:
          type: string
          format: date
          title: วันสิ้นสุด
        is_active:
          type: boolean
          title: เปิดใช้งาน
        is_current:
          type: boolean
          title: ภาคปัจจุบัน
          description: อนุญาตให้มีได้เพียงภาคเดียวต่อการใช้งาน (ผ่าน application-level
            ตรวจสอบ)
      required:
      - academic_year
      - end_date
      - semester
      - start_date
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        attendance_session:
          type: string
          format: uuid
          readOnly: true
          title: คาบเรียน
        session_date:
          type: string
          format: date
          readOnly: true
        course_code:
          type: string
          readOnly: true
        student:
          type: string
          format: uuid
          readOnly: true
          title: นักศึกษา
        student_code:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusC17Enum'
