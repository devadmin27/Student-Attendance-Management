      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
          description: ''
    delete:
      operationId: attendance_sessions_destroy
      description: Create/read sessions; lifecycle managed via /open /pause /close
        /cancel.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
