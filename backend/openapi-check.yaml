        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSessionCreate'
          description: ''
  /api/v1/attendance/sessions/{id}/:
    get:
      operationId: attendance_sessions_retrieve
      description: Create/read sessions; lifecycle managed via /open /pause /close
