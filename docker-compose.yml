# SAMS — local development stack
# Backend: Django runserver (dev)  |  Frontend: Next.js dev server
# Production/deployment guide: docs/deployment.md
services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    environment:
      DJANGO_DEBUG: "True"            # dev stack only — production sets False explicitly
      DB_ENGINE: ${DB_ENGINE:-sqlite} # default: SQLite for local dev
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-local-secret-change-me}
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:22-slim
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install &&
             npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
