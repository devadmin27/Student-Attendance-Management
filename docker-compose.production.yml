# ============================================================
# SAMS — Production Docker Compose (Coolify: one resource,
# shared domain https://sams.scphtrang.ac.th)
#
# Coolify setup:
#   Type: Docker Compose, Compose file: /docker-compose.production.yml
#   Build context: repo root (default)
#   Domain (resource level): https://sams.scphtrang.ac.th
#   Environment variables: DJANGO_SECRET_KEY, DB_NAME, DB_USER,
#     DB_PASSWORD, DB_HOST, DB_PORT, DB_SSLMODE, DJANGO_ALLOWED_HOSTS,
#     DJANGO_CORS_ALLOWED_ORIGINS, DJANGO_CSS...  (see docs/deployment.md §8)
#
# Routing (internal nginx proxy, all services on one network):
#   /api/v1/*  /admin/*  /static/*   -> backend (Django :8000)
#   everything else                  -> frontend (Next.js :3000)
# ============================================================

x-shared-env: &shared-env
  DJANGO_DEBUG: "False"
  DB_ENGINE: "postgresql"
  # Required real values (set in Coolify UI):
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
  DB_NAME: ${DB_NAME:?DB_NAME required}
  DB_USER: ${DB_USER:?DB_USER required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
  DB_HOST: ${DB_HOST:?DB_HOST required}
  DB_PORT: ${DB_PORT:-5432}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-sams.scphtrang.ac.th}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://sams.scphtrang.ac.th}
  DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-True}

services:
  # ── Reverse proxy: routes one shared domain by path ──────────────
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/sams.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    # Coolify attaches the resource domain + Let's Encrypt to THIS service.
    labels:
      - coolify.domain=${COOLIFY_FQDN:-https://sams.scphtrang.ac.th}

  # ── Django backend (same image as the root Dockerfile) ───────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
    expose:
      - "8000"

  # ── Next.js frontend (standalone build) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://sams.scphtrang.ac.th/api/v1}
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    expose:
      - "3000"
